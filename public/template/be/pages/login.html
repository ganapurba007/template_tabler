<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Admin LMS Template</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Tabler Icons Webfont CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Custom Template CSS -->
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>

  <div class="error-page-wrapper">
    <div class="auth-card-container" style="max-width: 420px; width: 100%;">
      
      <!-- Brand Logo -->
      <div class="text-center mb-4">
        <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
          <div class="sidebar-brand-icon">
            <i class="ti ti-brand-tabler"></i>
          </div>
          <span class="fs-4 fw-bold heading-custom">LMS Template</span>
        </a>
      </div>

      <!-- Auth Card -->
      <div class="card shadow-sm border mb-0">
        <div class="card-body p-4">
          <h2 class="h4 fw-bold heading-custom text-center mb-1">Masuk ke Akun Anda</h2>
          <p class="text-muted-custom small text-center mb-4">Masukkan email dan kata sandi Anda untuk melanjutkan</p>

          <form action="dashboard.html" method="GET">
            <div class="mb-3">
              <label class="form-label" for="email">Alamat Email</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-muted-custom"><i class="ti ti-mail"></i></span>
                <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="nama@domain.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label mb-0" for="password">Kata Sandi</label>
                <a href="forgot-password.html" class="small text-primary text-decoration-none">Lupa Kata Sandi?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 text-muted-custom"><i class="ti ti-lock"></i></span>
                <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="remember_me">
              <label class="form-check-label text-muted-custom small" for="remember_me">Ingat saya di perangkat ini</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2"><i class="ti ti-login me-1"></i> Masuk</button>
          </form>
        </div>
      </div>

      <!-- Footer text -->
      <div class="text-center mt-4">
        <p class="text-muted-custom small">Belum memiliki akun? <a href="register.html" class="text-primary fw-semibold">Daftar Sekarang</a></p>
      </div>

      <!-- Theme Toggle Switch -->
      <div class="text-center mt-3">
        <button type="button" class="theme-toggle-btn mx-auto" id="theme-toggle" aria-label="Toggle Theme">
          <i class="ti ti-moon fs-5"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Custom Scripts -->
  <script src="../assets/js/theme-toggle.js"></script>
</body>
</html>
