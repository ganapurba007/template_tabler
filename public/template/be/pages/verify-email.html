<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — Admin LMS Template</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Tabler Icons Webfont CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Custom Template CSS -->
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>

  <div class="error-page-wrapper">
    <div class="auth-card-container" style="max-width: 440px; width: 100%;">
      
      <!-- Brand Logo -->
      <div class="text-center mb-4">
        <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
          <div class="sidebar-brand-icon">
            <i class="ti ti-brand-tabler"></i>
          </div>
          <span class="fs-4 fw-bold heading-custom">LMS Template</span>
        </a>
      </div>

      <!-- Auth Card -->
      <div class="card shadow-sm border mb-0">
        <div class="card-body p-4">
          <div class="text-center mb-3">
            <div class="avatar-icon-box avatar-icon-primary mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
              <i class="ti ti-mail-forward"></i>
            </div>
            <h2 class="h4 fw-bold heading-custom mb-1">Verifikasi Email Anda</h2>
            <p class="text-muted-custom small">Terima kasih telah mendaftar! Sebelum memulai, harap verifikasi alamat email Anda dengan mengklik tautan yang baru saja kami kirimkan.</p>
          </div>

          <div class="alert alert-success d-flex align-items-center mb-4 small" role="alert">
            <i class="ti ti-circle-check me-2 fs-5"></i>
            <div>Tautan verifikasi baru telah dikirimkan ke alamat email Anda.</div>
          </div>

          <div class="d-flex flex-column gap-2">
            <button type="button" class="btn btn-primary w-100 py-2"><i class="ti ti-send me-1"></i> Kirim Ulang Email Verifikasi</button>
            <a href="login.html" class="btn btn-outline-secondary w-100 py-2"><i class="ti ti-logout me-1"></i> Keluar / Logout</a>
          </div>
        </div>
      </div>

      <!-- Theme Toggle Switch -->
      <div class="text-center mt-3">
        <button type="button" class="theme-toggle-btn mx-auto" id="theme-toggle" aria-label="Toggle Theme">
          <i class="ti ti-moon fs-5"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Custom Scripts -->
  <script src="../assets/js/theme-toggle.js"></script>
</body>
</html>
