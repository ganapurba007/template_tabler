<!-- Modal Component Partials -->

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0">
      <div class="modal-body text-center p-4">
        <div class="modal-icon-danger-box">
          <i class="ti ti-trash"></i>
        </div>
        <h4 class="h5 fw-bold heading-custom mb-2">Konfirmasi Hapus Data</h4>
        <p class="text-muted-custom mb-4" id="deleteModalMessage">
          Apakah Anda yakin ingin menghapus data <strong id="deleteItemName" class="text-dark">Ahmad Kadin</strong>? Tindakan ini tidak dapat dibatalkan.
        </p>
        <div class="d-flex align-items-center justify-content-center gap-2">
          <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-danger px-4" id="confirmDeleteBtn"><i class="ti ti-trash me-1"></i> Ya, Hapus</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Form Modal Example -->
<div class="modal fade" id="exampleFormModal" tabindex="-1" aria-labelledby="exampleFormModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold heading-custom" id="exampleFormModalLabel">Create New Course</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="modalCreateForm">
          <div class="mb-3">
            <label for="modalCourseTitle" class="form-label">Course Title</label>
            <input type="text" class="form-control" id="modalCourseTitle" placeholder="e.g. Web Development 101" required>
          </div>
          <div class="mb-3">
            <label for="modalCourseCategory" class="form-label">Category</label>
            <select class="form-select" id="modalCourseCategory">
              <option selected>Select category...</option>
              <option value="1">Programming</option>
              <option value="2">Design</option>
              <option value="3">Business</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer border-top">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary"><i class="ti ti-check me-1"></i> Save Course</button>
      </div>
    </div>
  </div>
</div>
